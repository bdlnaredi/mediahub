plugins {
    id 'com.android.application'
}

android {
    namespace 'com.bdlnaredi.mediahub'
    compileSdk 34

    defaultConfig {
        applicationId 'com.bdlnaredi.mediahub'
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName '1.1.0'
    }

    // A fixed key, so a newer mediahub.apk installs over an older one. It is in the repository on purpose
    // (see docs/ANDROID.md): this is for sideloading your own copy, not for the Play Store.
    signingConfigs {
        release {
            storeFile file('mediahub.keystore')
            storePassword 'mediahub'
            keyAlias 'mediahub'
            keyPassword 'mediahub'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    // The manifest isn't named .xml so that Unraid's Community Apps scan (which reads every .xml file in this
    // repository as a container template) leaves it alone
    sourceSets {
        main {
            manifest.srcFile 'src/main/AndroidManifest.android'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
